<h2>首页信息架构</h2>
<p class="subtitle">这么多天气模块，你希望首屏怎么排？选择最符合你使用习惯的一版。</p>

<div class="cards">
  <div class="card" data-choice="hero-grid" onclick="toggleSelect(this)">
    <div class="card-image" style="background: linear-gradient(135deg, #1e3c72 0%, #7e22ce 50%, #ea580c 100%); padding: 20px; display: flex; flex-direction: column; gap: 12px;">
      <div style="text-align: center; color: rgba(255,255,255,0.9);">
        <div style="font-size: 48px; font-weight: 200;">22°</div>
        <div style="font-size: 14px;">多云 · 体感 25°</div>
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <div style="height: 60px; border-radius: 16px; background: rgba(255,255,255,0.12); backdrop-filter: blur(12px);"></div>
        <div style="height: 60px; border-radius: 16px; background: rgba(255,255,255,0.12); backdrop-filter: blur(12px);"></div>
        <div style="height: 60px; border-radius: 16px; background: rgba(255,255,255,0.12); backdrop-filter: blur(12px);"></div>
        <div style="height: 60px; border-radius: 16px; background: rgba(255,255,255,0.12); backdrop-filter: blur(12px);"></div>
      </div>
    </div>
    <div class="card-body">
      <h3>A. 大温度 + 卡片网格</h3>
      <p>首屏核心就是大温度和天气状态，下方用玻璃卡片网格展示风力、湿度、AQI、日出日落等。信息密度高，一眼看完。</p>
    </div>
  </div>

  <div class="card" data-choice="split-dashboard" onclick="toggleSelect(this)">
    <div class="card-image" style="background: linear-gradient(135deg, #1e3c72 0%, #7e22ce 50%, #ea580c 100%); padding: 20px; display: flex; gap: 12px;">
      <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 8px; border-radius: 20px; background: rgba(255,255,255,0.1); backdrop-filter: blur(12px); padding: 16px;">
        <div style="font-size: 36px; font-weight: 200; color: rgba(255,255,255,0.9);">22°</div>
        <div style="font-size: 12px; color: rgba(255,255,255,0.7);">多云</div>
      </div>
      <div style="flex: 1.4; display: flex; flex-direction: column; gap: 8px;">
        <div style="height: 50px; border-radius: 14px; background: rgba(255,255,255,0.1); backdrop-filter: blur(10px);"></div>
        <div style="height: 50px; border-radius: 14px; background: rgba(255,255,255,0.1); backdrop-filter: blur(10px);"></div>
        <div style="height: 50px; border-radius: 14px; background: rgba(255,255,255,0.1); backdrop-filter: blur(10px);"></div>
      </div>
    </div>
    <div class="card-body">
      <h3>B. 左右分栏仪表盘</h3>
      <p>左侧固定当前天气大卡片，右侧滚动展示逐小时、逐天、雷达、指数等。更像专业气象仪表盘。</p>
    </div>
  </div>

  <div class="card" data-choice="immersive-scroll" onclick="toggleSelect(this)">
    <div class="card-image" style="background: linear-gradient(135deg, #1e3c72 0%, #7e22ce 50%, #ea580c 100%); padding: 20px; display: flex; flex-direction: column; gap: 12px; overflow: hidden;">
      <div style="text-align: center; color: rgba(255,255,255,0.9); padding: 20px 0;">
        <div style="font-size: 56px; font-weight: 200;">22°</div>
        <div style="font-size: 16px;">上海 · 多云</div>
      </div>
      <div style="height: 80px; border-radius: 20px; background: rgba(255,255,255,0.1); backdrop-filter: blur(12px);"></div>
      <div style="height: 80px; border-radius: 20px; background: rgba(255,255,255,0.1); backdrop-filter: blur(12px);"></div>
      <div style="font-size: 11px; color: rgba(255,255,255,0.5); text-align: center;">↓ 继续下滑查看更多</div>
    </div>
    <div class="card-body">
      <h3>C. 沉浸式长页面</h3>
      <p>首屏只放城市、温度和天气现象，下方模块依次展开，滚动时玻璃卡片以华丽动画浮现。强调视觉沉浸感。</p>
    </div>
  </div>
</div>
